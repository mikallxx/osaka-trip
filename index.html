<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪・奈良行程表｜2026/9/11–9/15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --jp-red:#BC002D;
    --jp-red-dark:#8F1D2C;
    --jp-red-soft:#F5DFE3;
    --washi:#F8F4EC;
    --washi-deep:#EFE7DA;
    --card:#FFFDFC;
    --ink:#241F1C;
    --ink-soft:#655D57;
    --muted:#8A817A;
    --gold:#B89454;
    --gold-soft:#F2E8D5;
    --gold-text:#8C6B2F;
    --sage:#71806B;
    --sage-soft:#E6ECE3;
    --sage-text:#465235;
    --border:#DDD3C7;
    --shadow:rgba(72,48,39,0.10);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--washi);
    background-image:
      radial-gradient(circle at 92% 8%, rgba(36,31,28,0.025) 0, transparent 45%),
      radial-gradient(circle at 4% 60%, rgba(184,148,84,0.03) 0, transparent 40%);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3{ font-family:'Noto Serif TC', serif; margin:0; }

  /* ---------- Header ---------- */
  header.hero{
    padding:64px 24px 40px;
    background:var(--washi-deep);
    color:var(--ink);
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:220px; height:220px;
    border:1px solid rgba(188,0,45,0.10);
    border-radius:50%;
  }
  header.hero::before{
    content:"";
    position:absolute; right:20px; bottom:-60px;
    width:150px; height:150px;
    border:1px solid rgba(184,148,84,0.18);
    border-radius:50%;
  }
  .hero-inner{ position:relative; z-index:1; max-width:640px; margin:0 auto; }
  .hero-kicker{
    font-size:13px; letter-spacing:0.14em;
    background:var(--card);
    display:inline-block; padding:4px 10px; border-radius:2px;
    color:var(--jp-red-dark); font-weight:700; margin-bottom:18px;
    border:1px solid var(--jp-red-soft);
  }
  h1.title{ font-size:clamp(32px,8vw,46px); font-weight:900; line-height:1.25; letter-spacing:0.02em; color:var(--ink); }
  .hero-rule{ width:42px; height:3px; background:var(--jp-red); border-radius:2px; margin:16px 0 0; }
  .hero-sub{ margin-top:14px; font-size:15px; color:var(--ink-soft); max-width:46ch; }
  .hero-route{ margin-top:28px; display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink); flex-wrap:wrap; }
  .hero-route .stop{ background:var(--card); border:1px solid var(--border); padding:5px 12px; border-radius:999px; }
  .hero-route .arrow{ color:var(--gold); opacity:0.85; }

  /* ---------- Day nav ---------- */
  nav.daynav{
    position:sticky; top:0; z-index:20;
    background:var(--washi);
    border-bottom:1px solid var(--border);
    overflow-x:auto; white-space:nowrap;
    padding:10px 16px;
    -webkit-overflow-scrolling:touch;
  }
  nav.daynav::-webkit-scrollbar{ display:none; }
  nav.daynav a{
    display:inline-block; text-decoration:none; color:var(--ink-soft);
    font-size:13px; font-weight:500; padding:7px 13px; border-radius:999px;
    margin-right:6px; border:1px solid var(--border); background:var(--card);
    transition:color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  nav.daynav a.active{
    color:var(--jp-red); font-weight:700;
    border-color:var(--jp-red-soft);
    box-shadow:inset 0 -2px 0 var(--jp-red);
  }
  nav.daynav a:active{ background:var(--jp-red-soft); }

  /* ---------- Trip info (住宿 / 打包檢查表) ---------- */
  section.trip-info{ max-width:640px; margin:20px auto 0; padding:0 20px; display:flex; flex-direction:column; gap:12px; }
  .info-card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; box-shadow:0 1px 3px var(--shadow);
  }
  .info-label{
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--jp-red); font-weight:700; margin-bottom:10px;
  }
  .stay-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--washi-deep); border:1px solid var(--border);
    color:var(--ink); text-decoration:none;
    font-size:14px; font-weight:700; padding:9px 14px; border-radius:999px;
  }
  .stay-chip::after{ content:"↗"; font-size:12px; color:var(--jp-red); margin-left:2px; }
  .stay-chip:active{ background:var(--jp-red-soft); border-color:var(--jp-red-soft); }
  .stay-note{ margin-top:8px; font-size:12.5px; color:var(--ink-soft); }

  .pack-cat{ margin-bottom:14px; }
  .pack-cat:last-child{ margin-bottom:0; }
  .pack-cat-title{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
  .pack-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 0; border-bottom:1px dashed var(--border);
    font-size:14px; color:var(--ink); cursor:pointer;
  }
  .pack-item:last-child{ border-bottom:none; }
  .pack-item input[type="checkbox"]{
    width:19px; height:19px; flex:none; accent-color:var(--jp-red); cursor:pointer;
  }
  .pack-item.checked .pack-text{ color:var(--muted); text-decoration:line-through; }
  .pack-progress{ font-size:12px; color:var(--ink-soft); margin-top:12px; text-align:right; }
  .pack-progress b{ color:var(--jp-red); }

  /* ---------- Days ---------- */
  main{ max-width:640px; margin:0 auto; padding:0 0 60px; overflow-x:hidden; }
  section.day{ padding:36px 20px 8px; scroll-margin-top:60px; }
  section.day + section.day{ border-top:1px solid var(--border); }

  .day-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .day-num{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:13px;
    color:var(--card); background:var(--ink); width:26px; height:26px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .day-date{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:22px; color:var(--ink); }
  .day-weekday{ font-size:13px; color:var(--ink-soft); }
  .day-theme{ margin:6px 0 20px 38px; font-size:14px; color:var(--ink-soft); }

  /* ---------- Accordion items ---------- */
  .items{ display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
  .item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 3px var(--shadow);
  }
  .item.highlight{
    border-color:var(--jp-red-soft);
    box-shadow:inset 3px 0 0 var(--jp-red), 0 1px 3px var(--shadow);
  }

  .item-row{
    width:100%; display:flex; align-items:flex-start; gap:10px;
    text-align:left; background:none; border:none; padding:14px 14px;
    cursor:pointer; font:inherit; color:inherit;
    scroll-margin-top:64px;
  }
  .item-row:active{ background:rgba(36,31,28,0.03); }

  .item-main{ flex:1; min-width:0; }
  .item-time{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:14px;
    color:var(--ink-soft); display:block; margin-bottom:2px;
  }
  .item.highlight .item-time{ color:var(--jp-red); }
  .item-titlewrap{ display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
  .item-title{ font-size:16px; font-weight:700; color:var(--ink); }
  .item-area{ font-size:12px; color:var(--muted); font-weight:400; }

  .item-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .tag{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px;
    border-radius:999px; white-space:nowrap; letter-spacing:0.02em;
  }
  .tag-transport{ background:var(--washi-deep); color:var(--ink-soft); border:1px solid var(--border); }
  .tag-urgent{ background:var(--jp-red); color:var(--card); }
  .tag-caution{ background:var(--jp-red-soft); color:var(--jp-red-dark); }
  .tag-reserved{ background:var(--gold-soft); color:var(--gold-text); }
  .tag-ticket{ background:var(--gold-soft); color:var(--gold-text); }
  .tag-good{ background:var(--sage-soft); color:var(--sage-text); }
  .tag-tbd{ background:var(--card); color:var(--muted); border:1px dashed var(--muted); }
  .tag-default{ background:var(--washi); color:var(--muted); border:1px solid var(--border); }

  .item-subtitle{
    margin-top:6px; font-size:12.5px; color:var(--jp-red-dark); font-weight:700;
    line-height:1.5;
  }
  .item-chain{
    margin-top:6px; font-size:12px; color:var(--muted);
    overflow-wrap:anywhere; line-height:1.6;
  }

  .item-arrow{
    flex:none; font-size:14px; color:var(--muted);
    margin-top:4px; transition:transform .25s ease, color .25s ease;
  }
  .item-arrow.arrow-open{ color:var(--jp-red); }

  /* ---------- Accordion animation (grid technique) ---------- */
  .accordion-wrap{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s ease;
  }
  .accordion-wrap.open{ grid-template-rows:1fr; }
  .accordion-inner{ overflow:hidden; min-height:0; }

  .detail-card{
    background:var(--washi-deep);
    border-top:1px solid var(--border);
    border-radius:0 0 12px 12px;
    padding:16px 14px;
  }
  .d-field{ display:flex; gap:8px; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .d-field:last-of-type{ border-bottom:none; }
  .d-label{ flex:none; width:88px; color:var(--ink-soft); font-weight:700; }
  .d-value{ flex:1; color:var(--ink); overflow-wrap:anywhere; }

  ol.d-steps{ list-style:none; margin:14px 0 4px; padding:0; counter-reset:step; }
  ol.d-steps li{
    counter-increment:step;
    position:relative; padding:0 0 14px 30px; font-size:13.5px;
  }
  ol.d-steps li::before{
    content:counter(step);
    position:absolute; left:0; top:0;
    width:20px; height:20px; border-radius:50%;
    background:var(--jp-red); color:var(--card);
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  ol.d-steps li::after{
    content:""; position:absolute; left:9px; top:22px; bottom:-2px;
    width:1px; background:var(--border);
  }
  ol.d-steps li:last-child::after{ display:none; }
  .s-time{ display:block; font-weight:700; color:var(--jp-red-dark); font-size:12px; margin-bottom:1px; }
  .s-text{ color:var(--ink); overflow-wrap:anywhere; }

  .detail-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .detail-actions .btn{
    flex:1; min-width:0; text-align:center;
    text-decoration:none; font-size:13px; font-weight:700;
    padding:9px 10px; border-radius:999px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
    transition:background .2s ease, color .2s ease;
  }
  .btn-map{ background:var(--jp-red); color:var(--card); }
  .btn-map:active{ background:var(--jp-red-dark); }
  .btn-official{ background:var(--card); color:var(--jp-red-dark); border:1px solid var(--border); }
  .btn-official:active{ background:var(--washi-deep); }

  footer{ text-align:center; padding:36px 20px 60px; font-size:12px; color:var(--muted); }
</style>
</head>

/* =========================================================
   2. 標籤樣式對照
   ========================================================= */
function tagClass(tag){
  const map = {
    '交通':'tag-transport',
    '須準時':'tag-urgent',
    '注意':'tag-caution',
    '已預約':'tag-reserved',
    '已購票':'tag-ticket',
    '必逛':'tag-good',
    '必吃':'tag-good',
    '待確認':'tag-tbd',
    '有空再去':'tag-default'
  };
  return map[tag] || 'tag-default';
}

/* =========================================================
   3. 渲染
   ========================================================= */
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

function fieldRow(label, value){
  if(!value) return '';
  return '<div class="d-field"><span class="d-label">' + label + '</span><span class="d-value">' + value + '</span></div>';
}

function renderDetail(detail){
  let html = '';
  html += fieldRow('建議停留', detail.stay);
  html += fieldRow('交通方式', detail.transport);
  html += fieldRow('移動時間', detail.travelTime);
  html += fieldRow('營業時間', detail.hours);
  html += fieldRow('最後入場', detail.lastEntry);
  html += fieldRow('必做／必買', detail.mustDo);
  html += fieldRow('預約狀態', detail.reservation);
  html += fieldRow('注意事項', detail.notes);

  if(detail.steps && detail.steps.length){
    html += '<ol class="d-steps">';
    detail.steps.forEach(s=>{
      html += '<li><span class="s-time">' + s.t + '</span><span class="s-text">' + s.text + '</span></li>';
    });
    html += '</ol>';
  }

  const hasMap = !!detail.mapQuery;
  const hasOfficial = !!detail.officialUrl;
  if(hasMap || hasOfficial){
    html += '<div class="detail-actions">';
    if(hasMap){
      html += '<a class="btn btn-map" href="' + mapUrl(detail.mapQuery) + '" target="_blank" rel="noopener">📍 Google Maps</a>';
    }
    if(hasOfficial){
      html += '<a class="btn btn-official" href="' + detail.officialUrl + '" target="_blank" rel="noopener">🔗 官方網站</a>';
    }
    html += '</div>';
  }
  return html;
}

let openBtn = null;

function closeBtn(btn){
  btn.setAttribute('aria-expanded','false');
  const wrap = document.getElementById(btn.getAttribute('aria-controls'));
  wrap.classList.remove('open');
  const arrow = btn.querySelector('.item-arrow');
  arrow.textContent = '▾';
  arrow.classList.remove('arrow-open');
}

function openBtnFn(btn){
  btn.setAttribute('aria-expanded','true');
  const wrap = document.getElementById(btn.getAttribute('aria-controls'));
  wrap.classList.add('open');
  const arrow = btn.querySelector('.item-arrow');
  arrow.textContent = '▲';
  arrow.classList.add('arrow-open');
}

function onRowClick(btn){
  const isOpen = btn.getAttribute('aria-expanded') === 'true';
  if(openBtn && openBtn !== btn){ closeBtn(openBtn); }
  if(isOpen){
    closeBtn(btn);
    openBtn = null;
  } else {
    openBtnFn(btn);
    openBtn = btn;
    requestAnimationFrame(()=>{
      setTimeout(()=>{ btn.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
    });
  }
}

function renderItem(item){
  const wrapper = document.createElement('div');
  wrapper.className = 'item' + (item.highlight ? ' highlight' : '');

  const btnId = 'btn-' + item.id;
  const panelId = 'panel-' + item.id;

  const tagsHtml = (item.tags && item.tags.length)
    ? '<div class="item-tags">' + item.tags.map(t=>'<span class="tag ' + tagClass(t) + '">' + t + '</span>').join('') + '</div>'
    : '';
  const subtitleHtml = item.subtitle ? '<div class="item-subtitle">' + item.subtitle + '</div>' : '';
  const chainHtml = (item.chain && item.chain.length) ? '<div class="item-chain">' + item.chain.join(' → ') + '</div>' : '';
  const areaHtml = item.area ? '<span class="item-area">（' + item.area + '）</span>' : '';

  wrapper.innerHTML =
    '<button class="item-row" id="' + btnId + '" aria-expanded="false" aria-controls="' + panelId + '">' +
      '<div class="item-main">' +
        '<span class="item-time">' + item.time + '</span>' +
        '<div class="item-titlewrap"><span class="item-title">' + item.title + '</span>' + areaHtml + '</div>' +
        tagsHtml + subtitleHtml + chainHtml +
      '</div>' +
      '<span class="item-arrow">▾</span>' +
    '</button>' +
    '<div class="accordion-wrap" id="' + panelId + '" role="region" aria-labelledby="' + btnId + '">' +
      '<div class="accordion-inner">' +
        '<div class="detail-card">' + renderDetail(item.detail) + '</div>' +
      '</div>' +
    '</div>';

  const rowBtn = wrapper.querySelector('.item-row');
  rowBtn.addEventListener('click', ()=> onRowClick(rowBtn));

  return wrapper;
}

function renderDay(day){
  const section = document.createElement('section');
  section.className = 'day';
  section.id = day.id;

  section.innerHTML =
    '<div class="day-head">' +
      '<span class="day-num">' + day.num + '</span>' +
      '<span class="day-date">' + day.dateLabel + '</span>' +
      '<span class="day-weekday">' + day.weekday + '</span>' +
    '</div>' +
    '<p class="day-theme">' + day.theme + '</p>';

  const list = document.createElement('div');
  list.className = 'items';
  day.items.forEach(item => list.appendChild(renderItem(item)));
  section.appendChild(list);

  return section;
}

function renderAll(){
  const nav = document.getElementById('daynav');
  const main = document.getElementById('main');
  tripData.forEach(day=>{
    const a = document.createElement('a');
    a.href = '#' + day.id;
    a.textContent = day.navLabel;
    nav.appendChild(a);

    main.appendChild(renderDay(day));
  });
}

/* -------- 日期導覽：捲動時自動標示目前所在日期（日本紅底線） -------- */
(function setupNavSpy(){
  const navLinks = Array.from(document.querySelectorAll('nav.daynav a'));
  const sections = tripData.map(d => document.getElementById(d.id));
  if(!navLinks.length || !sections.length) return;

  function setActive(id){
    navLinks.forEach(a=>{
      a.classList.toggle('active', a.getAttribute('href') === '#' + id);
    });
  }

  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ setActive(entry.target.id); }
    });
  }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

  sections.forEach(sec => observer.observe(sec));
  setActive(tripData[0].id);
})();

  packingData.forEach((cat, ci)=>{
    const catWrap = document.createElement('div');
    catWrap.className = 'pack-cat';

    const title = document.createElement('div');
    title.className = 'pack-cat-title';
    title.textContent = cat.category;
    catWrap.appendChild(title);

    cat.items.forEach((label, ii)=>{
      totalCount++;
      const itemId = 'p-' + ci + '-' + ii;
      const row = document.createElement('label');
      row.className = 'pack-item' + (checked[itemId] ? ' checked' : '');
      row.setAttribute('for', itemId);

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = itemId;
      cb.checked = !!checked[itemId];

      const text = document.createElement('span');
      text.className = 'pack-text';
      text.textContent = label;

      cb.addEventListener('change', ()=>{
        checked[itemId] = cb.checked;
        row.classList.toggle('checked', cb.checked);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); }catch(e){}
        updateProgress();
      });

      row.appendChild(cb);
      row.appendChild(text);
      catWrap.appendChild(row);
    });

    container.appendChild(catWrap);
  });

  function updateProgress(){
    const doneCount = Object.values(checked).filter(Boolean).length;
    progressEl.innerHTML = '已勾選 <b>' + doneCount + '</b> / ' + totalCount;
  }
  updateProgress();
})();
</script>

</body>
</html>
